services:
  - type: web
    name: wc2026-predictor
    env: node
    region: oregon
    plan: starter
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.5.0
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/wc2026.db
      - key: ADMIN_KEY
        generateValue: true
    disk:
      name: wc2026-data
      mountPath: /data
      sizeGB: 1
