services:
  - type: web
    name: wc2026-predictor
    env: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install && cd ../client && npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: ADMIN_KEY
        generateValue: true   # Render will auto-generate — check the Render dashboard
      - key: DB_PATH
        value: /var/data/wc2026.db
    disk:
      name: wc2026-data
      mountPath: /var/data
      sizeGB: 1
